<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث حشود المجد - ZEEKO ORG</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #1a2f1a;
            background-image: linear-gradient(to bottom, #011C28, #1a2f1a); 
            color: #ffffff;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .top-bar {
            width: 320px;
            height: 60px;
            background-color: #012638;
            border-radius: 20px;
            border: 2px solid #F4D03F;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .top-bar h1 { margin: 0; font-size: 20px; color: #F4D03F; font-weight: 900; }

        .app-logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            margin-bottom: 15px;
            border: 3px solid #F4D03F;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
            background-color: #012638;
        }

        .description-box {
            width: 300px;
            background-color: rgba(1, 38, 56, 0.7);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 25px;
            border: 1px solid #02405F;
        }

        .description-box p { margin: 0; font-size: 15px; line-height: 1.6; color: #ffffff; font-weight: bold; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 280px;
            height: 55px;
            margin-bottom: 15px;
            border-radius: 16px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            color: white;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.02);
        }

        .btn-mediafire { background: linear-gradient(135deg, #0277BD, #01579B); border: 1px solid #4FC3F7; }
        .btn-apkpure { background: linear-gradient(135deg, #004D40, #00695C); border: 1px solid #4DB6AC; }
        .btn-huawei { background: #263238; border: 1px solid #546E7A; }

        .btn-icon { margin-left: 12px; font-size: 20px; }

        /* زر سياسة الخصوصية في الأسفل */
        .privacy-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 700;
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 30px;
            box-shadow: none;
            width: auto;
            height: auto;
            letter-spacing: 0.5px;
        }

        .privacy-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: #F4D03F;
            transform: scale(1.03);
        }

        .privacy-btn .btn-icon {
            font-size: 16px;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>تحديث حشود المجد ⚔️</h1>
    </div>

    <!-- تأكد من رفع الصورة أو استخدام رابط مباشر صحيح -->
    <img src="https://zeekoorg.github.io/mobs_icon.png" alt="Mobs of Glory Logo" class="app-logo">

    <div class="description-box">
        <p>أيها المُهيب، الإصدار الجديد متاح الآن!<br>اختر السيرفر المناسب لك لتحميل التحديث ومواصلة حماية إمبراطوريتك.</p>
    </div>

    <!-- زر ميديا فاير -->
    <a href="https://www.mediafire.com/file/fr1zb4awwn12f1n/حشود+المجد.apk/file" class="btn btn-mediafire" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon">📥</span> تحميل مباشر (MediaFire)
    </a>

    <!-- زر متجر هواوي -->
    <a href="https://appgallery.huawei.com/app/C117592817" class="btn btn-huawei" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon">👜</span> متجر هواوي (AppGallery)
    </a>

    <!-- زر APKPure -->
    <a href="https://apkpure.com/p/com.zeekoorg.mobsofglory" class="btn btn-apkpure" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon">📲</span> متجر APKPure
    </a>

    <!-- زر سياسة الخصوصية في الأسفل -->
    <a href="https://www.zeekoorg.com/p/privacy-policy-mobs-of-glory.html" class="btn privacy-btn" target="_blank" rel="noopener noreferrer">
        <span class="btn-icon">🔒</span> سياسة الخصوصية
    </a>

</body>
</html>
