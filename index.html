    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #1a2f1a;
            background-image: linear-gradient(to bottom, #011C28, #1a2f1a); 
            color: #ffffff;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        .top-bar {
            width: 320px;
            height: 60px;
            background-color: #012638;
            border-radius: 20px;
            border: 2px solid #02405F;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .top-bar h1 { margin: 0; font-size: 20px; color: #F4D03F; font-weight: 900; }

        .marquee-wrapper {
            width: 320px;
            background-color: rgba(1, 38, 56, 0.6);
            border-radius: 12px;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 30px;
            padding: 8px 0;
            border: 1px solid #02405F;
        }

        .marquee-content {
            display: inline-block;
            color: #84FF01;
            font-size: 13px;
            font-weight: bold;
            padding-left: 100%;
            animation: scroll-text 25s linear infinite;
        }

        @keyframes scroll-text {
            0% { transform: translateX(0); }
            100% { transform: translateX(150%); }
        }

        /* تنسيق الشبكة الجديد */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 320px;
            margin-bottom: 30px;
        }

        .app-card {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid #02405F;
            border-radius: 18px;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border-color: #F4D03F;
        }

        .app-card-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            border: 2px solid #02405F;
            margin-bottom: 12px;
            object-fit: cover;
        }

        .logo-gold { border-color: #F4D03F; }

        .app-card-title {
            color: white;
            font-size: 14px;
            margin: 0 0 12px 0;
            font-weight: bold;
        }

        .app-card-btn {
            background: #012638;
            color: #4FC3F7;
            border: 1px solid #02405F;
            padding: 6px 15px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .footer {
            margin-top: auto;
            font-size: 12px;
            color: #8b949e;
            width: 320px;
            border-top: 1px solid #02405F;
            padding-top: 15px;
        }
