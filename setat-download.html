    <script>
        // دالة لجلب اللغة المفضلة للمستخدم
        function getPreferredLanguage() {
            // التحقق من لغة المتصفح
            const browserLang = navigator.language || navigator.userLanguage;
            // إذا كانت اللغة العربية أو تبدأ بـ "ar" نعيد "ar"، غير ذلك نعيد "en"
            if (browserLang.startsWith('ar')) {
                return 'ar';
            }
            return 'en';
        }

        // دالة لتطبيق اللغة على الصفحة
        function applyLanguage(lang) {
            // تحديث سمة lang و dir في وسم html
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

            // تحديث جميع العناصر التي تحمل ترجمة
            const elementsWithTranslation = document.querySelectorAll('[data-ar][data-en]');
            elementsWithTranslation.forEach(element => {
                if (lang === 'ar') {
                    element.textContent = element.getAttribute('data-ar');
                } else {
                    element.textContent = element.getAttribute('data-en');
                }
            });

            // تحديث عنوان الصفحة
            if (lang === 'ar') {
                document.title = 'تحميل سيتات اورج 2026 - ZEEKO ORG';
            } else {
                document.title = 'Download Setat Org 2026 - ZEEKO ORG';
            }

            // تحديث نص alt للصورة (اختياري)
            const logoImg = document.querySelector('.app-logo');
            if (logoImg) {
                logoImg.alt = lang === 'ar' ? 'شعار سيتات اورج' : 'Setat Org Logo';
            }
        }

        // عند تحميل الصفحة، نطبق اللغة المناسبة
        document.addEventListener('DOMContentLoaded', function() {
            const userLanguage = getPreferredLanguage();
            applyLanguage(userLanguage);
        });
    </script>
