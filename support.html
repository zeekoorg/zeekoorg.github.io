<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعم حشود المجد</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #d4af37;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .support-container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 20px;
            border: 2px solid #d4af37;
            border-radius: 15px;
            background-color: #262626;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        h2 { margin-bottom: 10px; font-size: 1.5em; }
        p { color: #ccc; font-size: 0.9em; margin-bottom: 20px; }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #333;
            border: 1px solid #555;
            border-radius: 10px;
            color: #fff;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            outline: none;
            margin-bottom: 20px;
        }
        textarea:focus { border-color: #d4af37; }
        button {
            width: 100%;
            background: linear-gradient(to bottom, #d4af37, #b8860b);
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="support-container">
    <h2>مرحباً بك أيها القائد</h2>
    <p>قدم ملاحظتك أو مشكلتك هنا وسيقوم فريقنا بمراجعتها فوراً.</p>
    
    <form action="https://formspree.io/f/xdabnlwa" method="POST">
        <textarea name="message" placeholder="اكتب ملاحظتك هنا..." required></textarea>
        <button type="submit">إرسال الملاحظة</button>
    </form>
</div>

</body>
</html>
